<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Deliberately generic. Every project-specific word on this page comes from
     the manifest, which has not been fetched yet at this point; app.js sets the
     real title and heading as soon as it has one. A game name written here
     would be a second place to change it, and the wrong one for any other
     project vendoring this same page. -->
<title>Asset converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- The static text here is English, which is the base locale. i18n.js
       replaces every [data-i18n] node on load and on each language change, so
       what ships in the markup is a readable fallback rather than the source
       of truth. -->
  <header class="page-head">
    <h1 id="title">Asset converter</h1>
    <select id="lang" class="lang-select"
            data-i18n-title="lang.label" data-i18n-aria-label="lang.aria"></select>
  </header>

  <p class="lede">
    <span id="lede-text">Convert your ROM into the file this port needs</span><button
      type="button" id="why" class="why" aria-expanded="false"
      data-i18n-aria-label="why.label" data-i18n-title="why.label">?</button>
  </p>
  <!-- The detail behind the "?". A title tooltip alone did nothing on click
       and nothing at all on touch, so this is a real disclosure. -->
  <p id="why-text" class="why-text" data-i18n="why.text" hidden></p>

  <!-- Which release to convert against. Read from the site's own
       dist/versions.json, newest first, so a new release reaches users without
       redeploying this page. Hidden when there is only one thing to load: a
       pinned build, or an offline bundle. -->
  <div class="version-bar">
    <span id="version-wrap" hidden>
      <label for="version" data-i18n="version.label">Version</label>
      <select id="version" class="version-select"></select>
      <span id="prerelease-wrap" hidden>
        <input type="checkbox" id="prerelease">
        <label for="prerelease" data-i18n="version.showPrereleases">Show pre-releases</label>
      </span>
    </span>
    <span id="version-note" class="version-note" hidden></span>
  </div>

  <div id="fatal" class="status bad" hidden></div>
  <!-- A version that publishes no converter: nothing to supply, nothing to run. -->
  <p id="no-converter" class="status" hidden></p>

  <!-- Populated only after the converter has been fetched, hash-matched
       against its manifest and passed conformance verification. Its presence
       is therefore the visible result of that check, while what it actually
       says is the thing a user wants to know: what goes in, what comes out. -->
  <div id="about" hidden>
    <div class="io">
      <div><span class="k" data-i18n="io.input">Input</span><span id="io-in"></span><span id="io-in-mark" class="mark"></span></div>
      <div class="arrow" aria-hidden="true">&rarr;</div>
      <div><span class="k" data-i18n="io.output">Output</span><span id="io-out"></span></div>
    </div>
  </div>

  <section id="input">
    <h2><span class="step">1.</span> <span id="input-heading">Your files</span></h2>
    <!-- One block per input role declared by the manifest: a plain button and
         the name of what was chosen, plus a list and an add control for a role
         the manifest marks repeatable. Dropping a file on a block works too,
         quietly. A project that takes a single file therefore renders as a
         single button. -->
    <div id="roles"></div>
  </section>

  <section id="run">
    <h2><span class="step">2.</span> <span data-i18n="run.heading">Convert</span></h2>
    <button id="go" data-i18n="run.button" disabled>Convert</button>
    <div id="run-status" class="status" hidden></div>
    <ul id="warnings" hidden></ul>
    <div id="results" hidden>
      <h3 data-i18n="results.heading">Output</h3>
      <ul id="downloads"></ul>
      <!-- The converted file is only half an install: the rest is what the
           project published, which the manifest already names and hashes. This
           offers both as one download rather than sending the user off to find
           the other half themselves. -->
      <div id="zip-wrap" class="zip-wrap" hidden>
        <button type="button" id="zip" data-i18n="zip.button">Download everything</button>
        <p id="zip-note" class="zip-note"></p>
        <div id="zip-status" class="status" hidden></div>
      </div>
    </div>
  </section>

  <footer>
    <p>
      <span data-i18n="footer.source">Source and documentation:</span>
      <a id="repo-link" href="#" data-i18n="footer.repo">the project repository</a>.
      <span data-i18n="footer.published">This page is published from the same CI
      run that builds and verifies the module, so the two always match.</span>
    </p>
    <p id="module-line" hidden></p>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
